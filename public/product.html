<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotAmazon - Product</title>
</head>
<script src="session-ui.js"></script>
<body>
    <header>
    <h1>NotAmazon</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="catalogue.html">Products</a>
        <a href="cart.html">Cart</a>

        <!-- These links will be hidden when the user is logged in -->
        <a href="Login.html" id="login-link">Login</a>
        <a href="signup.html" id="signup-link">Sign Up</a>

        <!-- This logout form starts hidden and will be shown when logged in -->
        <form method="POST" action="/logout" id="logout-form" style="display: none; margin: 0; padding: 0; display: inline;">
            <button type="submit">Logout</button>
        </form>
    </nav>

    <!-- Optional: a place to show who is logged in -->
    <p id="user-info"></p>
</header>


    <main>
        <section>
            <h2>Product Name</h2>
            <p><strong>Price:</strong> $XX.XX</p>
            <p><strong>Description:</strong> Detailed information about this product.</p>

             <!-- Add to Cart Form -->
            <form method="POST" action="/cart/add">
                <!-- These hidden inputs send data to the backend -->
                <input type="hidden" name="productId" value="1">
                <input type="hidden" name="productName" value="Product Name">
                <input type="hidden" name="price" value="XX.XX">
                <!-- Visible quantity selector -->
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity" value="1" min="1">
                <br>
                <button type="submit">Add to Cart</button>
            </form>

            <p><a href="catalogue.html">← Back to Products</a></p>
        </section>
    </main>
</body>
</html>
