<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotAmazon - Cart</title>
</head>
<script src="session-ui.js"></script>
<body>

<header>
    <h1>NotAmazon</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="catalogue.html">Products</a>
        <a href="cart.html">Cart</a>

        <!-- These links will be hidden when the user is logged in -->
        <a href="Login.html" id="login-link">Login</a>
        <a href="signup.html" id="signup-link">Sign Up</a>

        <!-- This logout form starts hidden and will be shown when logged in -->
        <form method="POST" action="/logout" id="logout-form" style="display: none; margin: 0; padding: 0; display: inline;">
            <button type="submit">Logout</button>
        </form>
    </nav>

    <!-- Optional: a place to show who is logged in -->
    <p id="user-info"></p>
</header>

<main>
    <h2>Your Cart</h2>

    <section>

        <!-- ---------------------- -->
        <!-- CART ITEM 1 (Example) -->
        <!-- ---------------------- -->
        <article>
            <h3>Product 1</h3>
            <p>Price: $10.00</p>

            <!-- Update quantity for item 1 -->
            <form method="POST" action="/cart/update">
                <input type="hidden" name="productId" value="1">

                <label>
                    Qty:
                    <input type="number" name="newQuantity" value="1" min="1">
                </label>

                <button type="submit">Update</button>
            </form>

            <!-- Remove item 1 -->
            <form method="POST" action="/cart/remove">
                <input type="hidden" name="productId" value="1">
                <button type="submit">Remove</button>
            </form>
        </article>

        <!-- ---------------------- -->
        <!-- CART ITEM 2 (Example) -->
        <!-- ---------------------- -->
        <article>
            <h3>Product 2</h3>
            <p>Price: $15.00</p>

            <!-- Update quantity for item 2 -->
            <form method="POST" action="/cart/update">
                <input type="hidden" name="productId" value="2">

                <label>
                    Qty:
                    <input type="number" name="newQuantity" value="2" min="1">
                </label>

                <button type="submit">Update</button>
            </form>

            <!-- Remove item 2 -->
            <form method="POST" action="/cart/remove">
                <input type="hidden" name="productId" value="2">
                <button type="submit">Remove</button>
            </form>
        </article>

    </section>

    <p><strong>Total: $40.00</strong></p>

    <!-- Proceed to checkout -->
    <form method="POST" action="/checkout">
        <button type="submit">Proceed to Checkout</button>
    </form>
    
    <p><a href="catalogue.html">← Continue Shopping</a></p>

</main>

</body>
</html>
