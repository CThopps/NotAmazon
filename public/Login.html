<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotAmazon - Login</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<script src="session-ui.js"></script>
<body>

<header>
    <h1>NotAmazon</h1>
     <nav>
        <a href="/">Home</a>
        <a href="/catalogue">Products</a>
        <a href="/cart">Cart</a>

        <a href="/admin/products" id="admin-link" style="display:none;">Admin</a>

        <a href="/Login.html" id="login-link">Login</a>
        <a href="/signup.html" id="signup-link">Sign Up</a>

        <form method="POST" action="/logout" id="logout-form" style="display:none;">
            <button type="submit">Logout</button>
        </form>
    </nav>
    <p id="user-info"></p>
</header>

<main>
    <h2>Login</h2>

    <form method="POST" action="/login">
    <label>
        Email:
        <input type="email" name="email" required>
    </label><br>

    <label>
        Password:
        <input type="password" name="password" required>
    </label><br>

    <button type="submit">Login</button>
</form>


    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</main>

</body>
</html>
