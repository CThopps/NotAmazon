<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotAmazon - Login</title>
    <link rel="stylesheet" href="/styles.css">

    <!-- Minimal modal CSS just for this page -->
    <style>
        /* Full-page dark overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;              /* hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* The white dialog box */
        .modal-box {
            background: #ffffff;
            padding: 20px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            max-width: 360px;
            width: 90%;
        }

        .modal-box h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .modal-box p {
            margin-top: 0;
            margin-bottom: 16px;
        }

        .modal-actions {
            text-align: right;
        }

        .modal-actions .secondary {
            background-color: #e7e9ec;
            border: 1px solid #a2a6ac;
        }

        .modal-actions .secondary:hover {
            background-color: #d5d7da;
        }
    </style>
</head>
<body>

<header>
    <h1>NotAmazon</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/catalogue">Products</a>
        <a href="/cart">Cart</a>

        <a href="/admin/products" id="admin-link" style="display:none;">Admin</a>

        <a href="/Login.html" id="login-link">Login</a>
        <a href="/signup.html" id="signup-link">Sign Up</a>

        <form method="POST" action="/logout" id="logout-form" style="display:none;">
            <button type="submit">Logout</button>
        </form>
    </nav>
    <p id="user-info"></p>
</header>

<main>
    <h2>Login</h2>

    <form method="POST" action="/login">
        <label>
            Email:
            <input type="email" name="email" required>
        </label><br>

        <label>
            Password:
            <input type="password" name="password" required>
        </label><br>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</main>

<!-- Error Modal -->
<div id="login-error-modal" class="modal-overlay">
    <div class="modal-box">
        <h3>Login Failed</h3>
        <p>Invalid email or password. Please try again.</p>
        <div class="modal-actions">
            <button id="close-error-modal" class="secondary">Close</button>
        </div>
    </div>
</div>

<script src="/session-ui.js"></script>

<script>
    // Show the modal if the URL has ?error=1
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const hasError = params.get('error') === '1';

        const modal = document.getElementById('login-error-modal');
        const closeBtn = document.getElementById('close-error-modal');

        if (hasError && modal) {
            modal.style.display = 'flex';   // flex centers the box in the overlay
        }

        if (closeBtn && modal) {
            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';

                // Remove ?error=1 from URL without reloading
                const cleanUrl = window.location.pathname;
                window.history.replaceState({}, '', cleanUrl);
            });
        }

        // Optional: click outside the modal box to close
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    const cleanUrl = window.location.pathname;
                    window.history.replaceState({}, '', cleanUrl);
                }
            });
        }
    });
</script>

</body>
</html>
