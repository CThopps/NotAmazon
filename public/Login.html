<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotAmazon - Login</title>
</head>
<body>

<header>
    <h1>NotAmazon</h1>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/catalogue">Products</a>
        <a href="/cart">Cart</a>

        <a href="/Login.html" id="login-link">Login</a>
        <a href="/signup.html" id="signup-link">Sign Up</a>

        <form method="POST" action="/logout" id="logout-form" style="display:none; margin:0; padding:0;">
            <button type="submit">Logout</button>
        </form>
    </nav>
</header>

<main>
    <h2>Login</h2>

    <form method="POST" action="/login">
        <div>
            <label for="email">Email:</label>
            <!-- name="email" is what shows up as req.body.email -->
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="password">Password:</label>
            <!-- name="password" is what shows up as req.body.password -->
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</main>

</body>
</html>
