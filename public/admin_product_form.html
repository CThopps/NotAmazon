<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotAmazon - Admin Add Product</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<script src="session-ui.js"></script>
<body>

<header>
    <h1>NotAmazon - Admin</h1>
     <nav>
        <a href="/">Home</a>
        <a href="/catalogue">Products</a>
        <a href="/cart">Cart</a>

        <a href="/admin/products" id="admin-link" style="display:none;">Admin</a>

        <a href="/Login.html" id="login-link">Login</a>
        <a href="/signup.html" id="signup-link">Sign Up</a>

        <form method="POST" action="/logout" id="logout-form" style="display:none;">
            <button type="submit">Logout</button>
        </form>
    </nav>
    <p id="user-info"></p>
</header>

<main>
    <h2>Add New Product</h2>

    <form method="POST" action="/admin/products/add">
        <div>
            <label>Name:
                <input type="text" name="name" required>
            </label>
        </div>

        <div>
            <label>Price:
                <input type="number" step="0.01" name="price" required>
            </label>
        </div>

        <div>
            <label>Stock:
                <input type="number" name="stock" required>
            </label>
        </div>

        <div>
            <label>Description:
                <textarea name="description" required></textarea>
            </label>
        </div>

        <button type="submit">Add Product</button>
    </form>
</main>

<script src="/session-ui.js"></script>
</body>
</html>
