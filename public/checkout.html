<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotAmazon - Checkout</title>
</head>
<script src="session-ui.js"></script>
<body>

<header>
    <h1>NotAmazon</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="catalogue.html">Products</a>
        <a href="/cart">Cart</a>

        <!-- These links will be hidden when the user is logged in -->
        <a href="Login.html" id="login-link">Login</a>
        <a href="signup.html" id="signup-link">Sign Up</a>

        <!-- This logout form starts hidden and will be shown when logged in -->
        <form method="POST" action="/logout" id="logout-form" style="display: none; margin: 0; padding: 0; display: inline;">
            <button type="submit">Logout</button>
        </form>
    </nav>

    <!-- Optional: a place to show who is logged in -->
    <p id="user-info"></p>
</header>

<main>
    <h2>Checkout</h2>

    <!-- IMPORTANT: wrap everything in a form that posts to /checkout -->
    <form method="POST" action="/checkout">
        <section>
            <h3>Shipping Information</h3>

            <label>
                Full Name:
                <input type="text" name="fullName" required>
            </label>
            <br>

            <label>
                Address:
                <input type="text" name="address" required>
            </label>
            <br>

            <label>
                City:
                <input type="text" name="city" required>
            </label>
            <br>

            <label>
                Postal Code:
                <input type="text" name="postalCode" required>
            </label>
            <br>

            <h3>Payment Information (Simulated)</h3>

            <label>
                Card Number:
                <input type="text" name="cardNumber">
            </label>
            <br>

            <label>
                Expiry:
                <input type="text" name="expiry" placeholder="MM/YY">
            </label>
            <br>

            <label>
                CVV:
                <input type="text" name="cvv">
            </label>
            <br><br>

            <!-- This actually submits the form to /checkout -->
            <button type="submit">Place Order</button>
        </section>
    </form>
</main>

</body>
</html>
